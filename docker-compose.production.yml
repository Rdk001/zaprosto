x-application: &application
  image: ${ZAPROSTO_IMAGE:-zaprosto:production}
  init: true
  networks:
    - backend
  environment: &application-environment
    NODE_ENV: production
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the production env file}
    POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the production env file}
    POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      - backend
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the production env file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the production env file}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - type: bind
        source: ${POSTGRES_PASSWORD_FILE:?Set POSTGRES_PASSWORD_FILE}
        target: /run/secrets/postgres_password
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  migrate:
    <<: *application
    command: ["migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${POSTGRES_PASSWORD_FILE:?Set POSTGRES_PASSWORD_FILE}
        target: /run/secrets/postgres_password
        read_only: true

  web:
    <<: *application
    build:
      context: .
      dockerfile: Dockerfile
    command: ["web"]
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - backend
      - edge
    environment:
      <<: *application-environment
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the exact HTTPS PUBLIC_ORIGIN}
      TRUST_PROXY_CLIENT_IP: "true"
    volumes:
      - media_data:/app/storage
      - type: bind
        source: ${POSTGRES_PASSWORD_FILE:?Set POSTGRES_PASSWORD_FILE}
        target: /run/secrets/postgres_password
        read_only: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  worker:
    <<: *application
    command: ["worker"]
    restart: unless-stopped
    stop_grace_period: 90s
    environment:
      <<: *application-environment
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:?Set TELEGRAM_BOT_USERNAME}
      TELEGRAM_POLL_TIMEOUT_SECONDS: ${TELEGRAM_POLL_TIMEOUT_SECONDS:-30}
    volumes:
      - media_data:/app/storage
      - type: bind
        source: ${POSTGRES_PASSWORD_FILE:?Set POSTGRES_PASSWORD_FILE}
        target: /run/secrets/postgres_password
        read_only: true
      - type: bind
        source: ${TELEGRAM_BOT_TOKEN_FILE:?Set TELEGRAM_BOT_TOKEN_FILE}
        target: /run/secrets/telegram_bot_token
        read_only: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('fs').readFileSync('/proc/1/task/1/children','utf8').trim()||process.exit(1)",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - edge
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?Set the public DNS name}
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres_data:
  media_data:
  caddy_data:
  caddy_config:
