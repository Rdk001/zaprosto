services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zaprosto}
      POSTGRES_USER: ${POSTGRES_USER:-zaprosto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zaprosto_local_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zaprosto} -d ${POSTGRES_DB:-zaprosto}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zaprosto}:${POSTGRES_PASSWORD:-zaprosto_local_only}@db:5432/${POSTGRES_DB:-zaprosto}?schema=public
      NODE_ENV: production
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      TRUST_PROXY_CLIENT_IP: ${TRUST_PROXY_CLIENT_IP:-false}
    ports:
      - "3000:3000"
    volumes:
      - media_data:/app/storage
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", ".worker-dist/worker.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zaprosto}:${POSTGRES_PASSWORD:-zaprosto_local_only}@db:5432/${POSTGRES_DB:-zaprosto}?schema=public
      NODE_ENV: production
    volumes:
      - media_data:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  postgres_data:
  media_data:
